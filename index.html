/*
1. Correct the odd appearance in Chrome and Safari.
2. Correct the outline style in Safari.
*/

[type='search'] {
  -webkit-appearance: textfield;
  /* 1 */
  outline-offset: -2px;
  /* 2 */
}

/*
Remove the inner padding in Chrome and Safari on macOS.
*/

::-webkit-search-decoration {
  -webkit-appearance: none;
}

/*
1. Correct the inability to style clickable types in iOS and Safari.
2. Change font properties to `inherit` in Safari.
*/

::-webkit-file-upload-button {
  -webkit-appearance: button;
  /* 1 */
  font: inherit;
  /* 2 */
}

/*
Add the correct display in Chrome and Safari.
*/

summary {
  display: list-item;
}

/*
Removes the default spacing and border for appropriate elements.
*/

blockquote,
dl,
dd,
h1,
h2,
h3,
h4,
h5,
h6,
hr,
figure,
p,
pre {
  margin: 0;
}

fieldset {
  margin: 0;
  padding: 0;
}

legend {
  padding: 0;
}

ol,
ul,
menu {
  list-style: none;
  margin: 0;
  padding: 0;
}

/*
Reset default styling for dialogs.
*/

dialog {
  padding: 0;
}

/*

*/

textarea {
  resize: vertical;
}

/*

2. Set the default placeholder color to the user's configured gray 400 color.
*/

  opacity: 1;
  /* 1 */
  color: #9ca3af;
  /* 2 */
}

input::placeholder,
textarea::placeholder {
  opacity: 1;
  /* 1 */
  color: #9ca3af;
  /* 2 */
}

/*
Set the default cursor for buttons.
*/

button,
[role="button"] {
  cursor: pointer;
}

/*

:disabled {
  cursor: default;

2. Add `vertical-align: middle` to align replaced elements more sensibly by default. (https://github.com/jensimmons/cssremedy/issues/14#issuecomment-634934210)

[hidden]:where(:not([hidden="until-found"])) {

.fixed {
  position: fixed;
}

.absolute {

}

.relative {

}

.sticky {

}

.block {
  display: block;
}

.flex {
  display: flex;
}

.table {
  display: table;
}

.grid {
  display: grid;
}

.hidden {
  display: none;
}

.border {
  border-width: 1px;
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);

.transition {

  transition-duration: 150ms;
}

:root{
  --bg:#F4F5F7;
  --surface:#FFFFFF;
  --surface2:#F8FAFC;
  --border:#E2E8F0;
  --text:#1A2332;
  --muted:#64748B;
  --body:#334155;
  --primary:#2563EB;
  --primary-dark:#1D4ED8;
  --teal:#0F766E;
  --green:#137333;
  --amber:#92400E;
  --red:#A50E0E;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#F4F5F7;
    --surface:#FFFFFF;
    --surface2:#F8FAFC;
    --border:#E2E8F0;
    --text:#1A2332;
    --muted:#64748B;
    --body:#334155;
    --primary:#2563EB;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth;
  max-width:100%;
  overflow-x:clip
}

body{
  margin:0;
  max-width:100%;
  overflow-x:clip;
  background:var(--bg);
  color:var(--text);
  font-family:ui-sans-system,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.6
}

a{
  color:var(--primary)
}

code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  word-break:break-all;
  overflow-wrap:anywhere;
  max-width:100%
}

pre{
  white-space:pre;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  overflow-wrap:anywhere;
  max-width:100%
}

img,table,pre,code,iframe{
  max-width:100%
}

section[id]{
  scroll-margin-top:118px
}

::-webkit-scrollbar{
  height:8px;
  width:10px
}

::-webkit-scrollbar-thumb{
  background:#CBD5E1;
  border-radius:99px
}

::-webkit-scrollbar-track{
  background:#F1F5F9
}

/* Layout */

.layout{
  display:flex;
  gap:20px;
  align-items:flex-start;
  padding:20px 16px 40px
}

.sidebar{
  width:260px;
  flex-shrink:0;
  position:sticky;
  top:calc(var(--safe-area-inset-top) + 68px);
  max-height:calc(100vh - 90px);
  overflow-y:auto
}

.sidebar-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

.sidebar-nav{
  display:flex;
  flex-direction:column;
  gap:2px
}

.sidebar-link{
  display:block;
  padding:9px 12px;
  border-radius:8px;
  color:#334155;
  text-decoration:none;
  font-size:13px;
  border:1px solid transparent;
  min-height:40px;
  display:flex;
  align-items:center
}

.sidebar-link:hover{
  background:#F1F5F9;
  color:#1A2332
}

.sidebar-link.active{
  background:#2563EB;
  border-color:#2563EB;
  color:#fff;
  font-weight:700
}

.mobile-nav{
  display:none
}

.responsive-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));
  gap:14px
}

.cmd-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));
  gap:12px
}

.hero-form{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:stretch
}

.hero-card{
  padding:26px 22px
}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px
}

.table-wrap{
  display:block;
  overflow-x:auto;
  max-width:100%;
  -webkit-overflow-scrolling:touch
}

.table-wrap table{
  min-width:520px
}

.cmd-pre{
  background:#F1F5F9;
  border:1px solid #E2E8F0;
  border-radius:8px;
  padding:12px;
  overflow-x:auto;
  color:#0F172A;
  font-size:13px;
  line-height:1.6;
  max-width:100%
}

.card{
  background:#FFFFFF;
  border:1px solid var(--border);
  border-radius:8px;
  padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  min-width:0;
  overflow-wrap:anywhere
}

.badge{
  font-size:11px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  padding:4px 8px;
  border-radius:999px;
  display:inline-flex;
  gap:6px;
  align-items:center;
  line-height:1.4;
  max-width:100%;
  overflow-wrap:anywhere
}

.badge-passive{
  background:#E6F4EA;
  color:#137333
}

.badge-active{
  background:#FEF3C2;
  color:#92400E
}

.badge-lab{
  background:#FCE8E6;
  color:#A50E0E
}

.badge-blue{
  background:#EFF6FF;
  color:#1D4ED8;
  border:1px solid #DBEAFE
}

.btn{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-weight:700;
  cursor:pointer;
  font-size:13px;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  white-space:nowrap
}

.btn-cyan{
  background:var(--primary);
  color:#fff
}

.btn-cyan:hover{
  background:var(--primary-dark)
}

.btn-ghost{
  background:#fff;
  color:#1A2332;
  border:1px solid #CBD5E1
}

.btn-ghost:hover{
  background:#F8FAFC
}

.btn-small{
  padding:7px 10px;
  font-size:12px;
  min-height:44px
}

.input{
  width:100%;
  background:#fff;
  border:1px solid #CBD5E1;
  border-radius:8px;
  color:#1A2332;
  padding:13px 14px;
  font-size:15px;
  outline:none;
  min-height:48px
}

.input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.15)
}

.input-error{
  border-color:#DC2626!important;
  box-shadow:0 0 0 3px rgba(220,38,38,.12)!important
}

details.vuln{
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

details.vuln summary{
  cursor:pointer;
  padding:14px 16px;
  font-weight:700;
  list-style:none;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  color:#1A2332;
  min-height:44px
}

details.vuln summary::-webkit-details-marker{
  display:none
}

details.vuln[open ] summary{
  background:#F8FAFC
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th{
  text-align:left;
  padding:10px;
  border-bottom:1px solid var(--border);
  color:#1A2332;
  background:#F8FAFC
}

td{
  padding:10px;
  border-bottom:1px solid #E2E8F0;
  vertical-align:top;
  color:#334155
}

input[type="checkbox"]{
  width:20px;
  height:20px;
  accent-color:#2563EB;
  flex-shrink:0
}

textarea{
  font-family:inherit
}

@media print{
  .no-print{
    display:none!important
  }

  body{
    background:#fff;
    color:#000
  }

  .card,details.vuln{
    background:#fff!important;
    color:#000;
    border-color:#999
  }

  .cmd-pre{
    background:#f1f5f9!important;
    color:#111
  }

  details.vuln{
    -moz-column-break-inside:avoid;
         break-inside:avoid
  }
}

/* Tablet */

@media (max-width:1023px){
  .sidebar{
    width:220px
  }

  .layout{
    gap:16px
  }

  .cmd-grid{
    grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))
  }

  main{
    max-width:100%
  }
}

/* Mobile / Android — single-column layout, no page-level horizontal scroll */

@media (max-width:768px){
  html,body{
    max-width:100%;
    overflow-x:clip
  }

  body{
    font-size:15px;
    line-height:1.5
  }

  /* Header stacks vertically and wraps */

  .app-header > div{
    flex-direction:column!important;
    align-items:flex-start!important;
    gap:10px!important;
    padding:12px 14px!important
  }

  .app-header > div > div{
    max-width:100%;
    min-width:0
  }

  /* Layout: single column, sidebar becomes static full-width below content */

  .layout{
    display:flex!important;
    flex-direction:column!important;
    gap:0!important;
    width:100%!important;
    max-width:100%!important;
    padding:12px 14px 28px!important
  }

  .layout main,.main-content{
    order:1!important;
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    padding:0!important
  }

  .sidebar{
    order:2!important;
    position:static!important;
    width:100%!important;
    max-height:none!important;
    overflow:visible!important;
    margin-top:16px!important;
    flex-shrink:1!important
  }

  .sidebar-card{
    max-width:100%
  }

  /* Horizontal scrollable pill nav */

  .mobile-nav{
    display:flex!important;
    position:sticky;
    top:var(--safe-area-inset-top);
    z-index:38;
    background:#fff;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    gap:8px;
    padding:8px 14px;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none
  }

  .mobile-nav::-webkit-scrollbar{
    display:none
  }

  .mobile-nav a{
    flex:0 0 auto;
    padding:10px 14px;
    border-radius:999px;
    color:#334155;
    text-decoration:none;
    font-size:13px;
    font-weight:600;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    border:1px solid var(--border);
    background:#F8FAFC
  }

  .mobile-nav a.active,.mobile-nav a:active{
    background:#2563EB;
    color:#fff;
    border-color:#2563EB
  }

  .sidebar-nav{
    flex-direction:row;
    overflow-x:auto;
    padding-bottom:6px;
    gap:6px;
    max-width:100%
  }

  .sidebar-link{
    white-space:nowrap;
    flex:0 0 auto;
    min-height:44px
  }

  section[id]{
    scroll-margin-top:12px
  }

  main > section{
    margin-top:14px!important
  }

  #hero{
    margin-top:0!important
  }

  /* Hero */

  .hero-card{
    padding:14px!important
  }

  h1{
    font-size:24px!important;
    line-height:1.25
  }

  h2{
    font-size:20px!important;
    line-height:1.3
  }

  h3{
    font-size:17px!important;
    line-height:1.35
  }

  .hero-form{
    flex-direction:column!important;
    gap:10px!important;
    width:100%
  }

  .hero-form > *{
    width:100%!important;
    flex:none!important;
    max-width:100%!important;
    min-width:0!important
  }

  .hero-form .input{
    font-size:16px!important;
    min-height:48px
  }

  .hero-form .btn{
    min-height:48px!important;
    font-size:15px
  }

  .hero-stats{
    grid-template-columns:1fr!important
  }

  /* Cards / grids: one column, wrapping headers, full-width copy buttons */

  .cmd-grid,.responsive-grid{
    grid-template-columns:1fr!important;
    gap:12px
  }

  .card{
    padding:14px!important;
    min-width:0;
    overflow-wrap:anywhere
  }

  .card > div,.cmd-grid article > div{
    flex-wrap:wrap!important;
    min-width:0
  }

  .badge{
    white-space:normal;
    text-align:left;
    overflow-wrap:anywhere
  }

  .btn{
    white-space:normal;
    text-align:center;
    min-height:44px;
    overflow-wrap:anywhere
  }

  .card .btn,.cmd-pre + .btn{
    width:100%!important;
    max-width:100%
  }

  .cmd-pre{
    font-size:12.5px!important;
    line-height:1.5;
    padding:11px
  }

  pre{
    font-size:12.5px;
    line-height:1.5
  }

  code{
    font-size:12.5px
  }

  /* Tables scroll inside their card, never widen the page */

  .table-wrap{
    display:block!important;
    overflow-x:auto!important;
    width:100%!important;
    max-width:100%!important
  }

  .table-wrap table{
    min-width:480px;
    font-size:13px
  }

  th,td{
    padding:8px;
    font-size:13px;
    overflow-wrap:anywhere
  }

  /* Accordions, checklists, forms */

  details.vuln summary{
    flex-wrap:wrap!important;
    align-items:flex-start!important;
    gap:8px;
    padding:14px
  }

  details.vuln summary > span{
    min-width:0;
    overflow-wrap:anywhere
  }

  details.vuln summary > span:first-child{
    flex:1 1 100%
  }

  details.vuln > div{
    padding-left:14px!important;
    padding-right:14px!important
  }

  input,select,textarea{
    width:100%!important;
    max-width:100%;
    font-size:16px
  }

  input[type="checkbox"]{
    width:22px!important;
    height:22px!important;
    min-width:22px
  }

  label{
    overflow-wrap:anywhere;
    min-width:0
  }

  /* Toast: full-width bar above the bottom edge, never wider than viewport */

  .toast-banner{
    left:12px!important;
    right:12px!important;
    bottom:12px!important;
    width:auto!important;
    max-width:calc(100vw - 24px)!important;
    box-sizing:border-box;
    white-space:normal!important;
    text-align:left
  }
}

@media (max-width:420px){
  .layout{
    padding:10px 10px 24px!important
  }

  .app-header > div{
    padding:10px!important
  }

  .mobile-nav{
    padding:8px 10px
  }

  .hero-card{
    padding:12px!important
  }

  .card{
    padding:12px!important
  }

  .cmd-pre{
    padding:10px;
    font-size:12.5px
  }

  h1{
    font-size:22px!important
  }

  h2{
    font-size:20px!important
  }

  .table-wrap table{
    min-width:440px
  }

  .hero-stats{
    grid-template-columns:1fr!important
  }
}

tall:"go install github.com/lukasikic/subzy@latest",risk:"Passive"},{tool:"TruffleHog",purpose:"Secret scan of workspace",cmd:(e)=>"trufflehog filesystem --directory .",expl:"Scan your own recon folder and any code you are authorized to test.",expected:"Potential secret hits.",depends:"Workspace",install:"Install from TruffleHog releases",risk:"Passive"},{tool:"Gitleaks",purpose:"Git history secret scan",cmd:(e)=>"gitleaks detect --source .",expl:"History often leaks keys that current code hides.",expected:"Gitleaks findings.",depends:"Repo / workspace",install:"sudo apt install gitleaks",risk:"Passive"},{tool:"JS / Secrets grep",purpose:"Grep JS + URLs for secret patterns",cmd:(e)=>'grep -rE "(api_key|apikey|secret|token|password|Authorization)" javascript/ urls/ || true',expl:"Pattern grep is noisy — every hit needs manual context. Never use a found credential.",expected:"Candidate lines to triage.",depends:"Crawled JS / URLs",install:"grep",risk:"Passive"}]}],gi=[{name:"Information Disclosure",tag:"disclosure recon",what:"Sensitive data exposed in responses, headers, JS, errors, or public files.",why:"Verbose errors, debug mode, leftover files, and unreviewed JS leak internals.",where:"Error pages, JS bundles, /.git/, robots, headers, API errors, backup files.",test:"In authorized scope, request error-triggering inputs and inspect full responses, headers, and JS. Compare authenticated vs unauthenticated responses.",burp:"Send error cases to Repeater. Use Comparer on authed vs anon responses.",example:`curl -s -i https://${I}/api/profile -H "Cookie: <SESSION_COOKIE>"`,look:"Stack traces, internal IPs, keys, user data, debug flags, source maps.",impact:"Show what an unauthenticated user can learn and how it enables the next bug.",falsePos:"Intentionally public docs, generic framework errors, or test data.",remediation:"Generic errors, strip debug, remove secrets, set security headers, review JS.",tools:"Burp, Nuclei, TruffleHog, Gitleaks"},{name:"Broken Access Control & IDOR",tag:"idor access control",what:"Users can access or modify objects belonging to others by changing an ID.",why:"Missing server-side authorization check on the object, not just hiding the link.",where:"/profile?id=, /orders/123, /api/users/42, file downloads, admin endpoints.",test:"With two test accounts, swap IDs in Repeater. Test sequential, UUID, and encoded IDs. Test direct API calls without UI.",burp:"Repeater one-param-at-a-time. Comparer for Account A vs Account B responses.",example:`curl -s https://${I}/api/orders/123 -H "Cookie: <SESSION_COOKIE>"`,look:"200 + another user's data, or successful update/delete. Watch for 403 vs 200 differences.",impact:"Read/modify/delete another user's data with only your own account.",falsePos:"Public/shared resources, or IDs that are intentionally guessable but not sensitive.",remediation:"Server-side authorization on every object, deny by default, audit logs.",tools:"Burp Repeater, Autorize (lab)"},{name:"Authentication Vulnerabilities",tag:"auth login",what:"Weak login, session, MFA, or password-reset logic lets an attacker become another user.",why:"No rate limiting, predictable tokens, logic flaws, or verbose errors.",where:"Login, reset, MFA, remember-me, OAuth callback, session cookies.",test:"In your own accounts, test rate limits, lockout, reset-token entropy, MFA bypass via response tampering (lab), and session fixation.",burp:"Proxy login flow, Repeater reset requests, Sequencer on tokens.",example:`curl -s -i -X POST https://${I}/login -d 'email=test@example.com&password=Test1234!'`,look:"No lockout, same token reused, reset token in URL, weak session entropy.",impact:"Account takeover with only an email or weak password.",falsePos:"Test-account quirks, CAPTCHA that still allows one valid attempt.",remediation:"Rate limit, lockout, strong random tokens, secure cookies, MFA.",tools:"Burp Sequencer, Intruder (authorized rate-limited)"},{name:"Cross-Site Scripting (XSS)",tag:"xss reflected stored blind",what:"Attacker script runs in a victim's browser in the target's origin.",why:"User input reflected/stored without proper output encoding for its context.",where:"Search, comments, profile fields, error messages, file names, headers.",test:"LAB / own test account only. Use a benign marker first, then a safe probe in your own account. Never target real users.",burp:"Repeater each field alone. Use Collaborator / Interactsh for blind cases.",example:"<img src=x onerror=alert(document.domain)>  — LAB / own test account only",look:"Payload reflected unencoded, executes in your lab browser, or fires in Collaborator.",impact:"Session theft, actions as victim, defacement — prove with your own account.",falsePos:"Encoded output, CSP blocking execution, or payload in a safe context.",remediation:"Context-aware encoding, CSP, sanitize HTML, HttpOnly cookies.",tools:"Burp, Dalfox (lab), XSStrike (lab)"},{name:"DOM-Based XSS",tag:"dom xss",what:"XSS caused by unsafe JavaScript handling of attacker-controlled data in the DOM.",why:"innerHTML, document.write, or eval on location/hash/input without sanitization.",where:"Hash fragments, postMessage handlers, client-side routing, search widgets.",test:"In lab, trace sources (location.hash, postMessage) to sinks (innerHTML, eval). Test with a benign marker.",burp:"Proxy JS, search JS for sinks. Use browser DevTools + DOM Invader in lab.",example:`https://${I}/search#<img src=x onerror=alert(document.domain)> — LAB ONLY`,look:"Payload lands in DOM without encoding; sink executes it.",impact:"Same as XSS, but server logs may show nothing.",falsePos:"Framework auto-escaping, or sink that only handles trusted data.",remediation:"Use textContent, sanitize DOM input, avoid eval/innerHTML.",tools:"Burp DOM Invader, DevTools"},{name:"SQL Injection (SQLi)",tag:"sqli injection",what:"Attacker-controlled input alters a database query.",why:"String concatenation instead of parameterized queries.",where:"id, search, filters, sort, login, API params.",test:"Authorized only. Start with detection: single quote, boolean, and timing checks in your own test data. Do not dump real data.",burp:"Repeater one param at a time. Compare true/false responses and timing.",example:`curl -s "https://${I}/search?q=test%27" -H "Cookie: <SESSION_COOKIE>"`,look:"DB error, boolean difference, or consistent timing delay.",impact:"Read/modify data, bypass login — prove with a safe, non-destructive query.",falsePos:"Generic errors, WAF blocks, or app-level validation.",remediation:"Parameterized queries, least-privilege DB user, input validation.",tools:"Burp, SQLmap (authorized, lab-first)"},{name:"NoSQL Injection",tag:"nosql injection",what:"Attacker input alters a NoSQL query or operator.",why:"Unsanitized JSON / query operators passed to MongoDB-style queries.",where:"Login, search, filters, JSON API bodies.",test:"Authorized only. Test operator injection in lab with benign operators and observe auth / filter behavior.",burp:"Repeater with JSON body; test $ne, $gt, $regex carefully in lab.",example:`curl -s -X POST https://${I}/api/login -H 'Content-Type: application/json' -d '{"email":"test@example.com","password":{"$ne":""}}'  # LAB ONLY`,look:"Login bypass or filter bypass in lab.",impact:"Auth bypass, data exposure.",falsePos:"App rejects operators, or test data behaves differently.",remediation:"Strict schema, allow-list operators, parameterized queries.",tools:"Burp, NoSQLMap (lab)"},{name:"Path Traversal / LFI & RFI",tag:"traversal lfi rfi",what:"File path input escapes the intended directory.",why:"User input used as a file path without allow-listing.",where:"file=, download, template, language, include params.",test:"LAB ONLY. Test ../ sequences and encoded variants on your own test files. Never read real system files on a live target.",burp:"Repeater with encoded traversal variants, one at a time.",example:`curl -s "https://${I}/download?file=..%2F..%2Ftest.txt"  # LAB ONLY`,look:"File content outside intended folder, or error revealing paths.",impact:"Read config / source, sometimes RCE via log inclusion.",falsePos:"App serves a default file, or WAF block page.",remediation:"Allow-list filenames, chroot / safe joins, no user-controlled paths.",tools:"Burp, FFUF (lab)"},{name:"File Upload Vulnerabilities",tag:"upload file",what:"Unsafe uploads allow stored XSS, traversal, or code execution.",why:"Extension / MIME checked client-side only, or stored in web-accessible path.",where:"Avatar, document, import, image upload.",test:"LAB ONLY. Upload a benign .txt, test extension/case/double-extension and content-type handling. DO NOT upload a real shell to a live target.",burp:"Repeater multipart, change filename + content-type, check storage path.",example:`curl -s -F "file=@benign.txt;filename=test.txt" https://${I}/upload -H "Cookie: <SESSION_COOKIE>"  # LAB ONLY`,look:"File stored, served with executable MIME, or path traversal.",impact:"Stored XSS, defacement, or RCE in lab.",falsePos:"File stored but not served, or renamed to random name.",remediation:"Allow-list extensions, random names, scan, serve from CDN / non-exec path.",tools:"Burp Repeater"},{name:"OS Command Injection",tag:"command injection rce",what:"Input reaches a shell command.",why:"Unsanitized input concatenated into system() / exec().",where:"ping, lookup, export, image-processing, diagnostics.",test:"LAB ONLY. Use ; id style probes only in lab. On live targets use time-delay detection with permission and no destructive commands.",burp:"Repeater with separators, observe timing / output.",example:`curl -s "https://${I}/ping?host=127.0.0.1%3B+sleep+3"  # LAB ONLY`,look:"Command output or consistent delay.",impact:"Remote code execution as app user.",falsePos:"App echoes input, or network delay.",remediation:"No shell, allow-list args, exec with array args.",tools:"Burp, Commix (lab)"},{name:"CSRF",tag:"csrf",what:"A victim's browser performs an unwanted state-changing request.",why:"No unpredictable token tied to session / action.",where:"Password change, email change, transfer, delete, settings.",test:"With your own two accounts, replay a state-changing request without token / referer and see if it succeeds.",burp:"Repeater: drop token, change Origin/Referer, test SameSite.",example:`curl -s -X POST https://${I}/settings/email -H "Cookie: <SESSION_COOKIE>" -d 'email=attacker@example.com'`,look:"State changes without token.",impact:"Account takeover, email change, data loss.",falsePos:"GET-only actions, or token validated server-side.",remediation:"Per-session CSRF token, SameSite=Lax/Strict, re-auth for sensitive actions.",tools:"Burp Repeater"},{name:"Clickjacking",tag:"clickjacking ui",what:"Target site framed so clicks land on hidden attacker UI.",why:"Missing X-Frame-Options / frame-ancestors.",where:"Any page with sensitive buttons, especially settings / OAuth consent.",test:"Try framing the page in your own lab page. Check headers.",burp:"Check response headers in Proxy / Repeater.",example:`curl -s -I https://${I}/settings`,look:"No X-Frame-Options / CSP frame-ancestors.",impact:"Tricked clicks on sensitive actions.",falsePos:"Page is intentionally embeddable, or CSP allows only same-origin.",remediation:"CSP frame-ancestors 'none' or 'self', X-Frame-Options DENY.",tools:"Burp, curl"},{name:"CORS Misconfiguration",tag:"cors",what:"Over-permissive CORS lets another origin read responses with credentials.",why:"Reflecting Origin + Allow-Credentials: true, or wildcard with credentials.",where:"API endpoints, auth endpoints.",test:"Send Origin: https://evil.example and inspect ACAO / Allow-Credentials. Use your own account.",burp:"Repeater: vary Origin, compare headers.",example:`curl -s -H "Origin: https://evil.example" -H "Cookie: <SESSION_COOKIE>" -i https://${I}/api/me`,look:"ACAO reflects evil origin + Allow-Credentials: true.",impact:"Cross-origin data theft.",falsePos:"Public API with no credentials.",remediation:"Allow-list origins, no credentials with wildcard.",tools:"Burp, curl"},{name:"JWT Vulnerabilities",tag:"jwt token",what:"Weak JWT signing / validation lets an attacker forge or alter tokens.",why:"alg=none, weak secret, no signature check, sensitive claims trusted.",where:"Authorization: Bearer, cookies, API auth.",test:"LAB / own account. Decode token, test alg=none, kid / jku handling, and claim tampering in lab.",burp:"Repeater with modified token, Decoder for base64.",example:`curl -s https://${I}/api/me -H "Authorization: Bearer <JWT>"`,look:"Server accepts none / unsigned / tampered token.",impact:"Auth bypass, privilege escalation.",falsePos:"Token rejected, or signature verified correctly.",remediation:"Strong secret, RS256, verify alg + exp + aud, no sensitive data in payload.",tools:"jwt_tool (lab), Burp"},{name:"OAuth Vulnerabilities",tag:"oauth",what:"Flaws in OAuth flow let an attacker steal tokens or link accounts.",why:"Missing state, open redirect in redirect_uri, implicit flow, token leakage.",where:"Login with Google/GitHub, callback, account linking.",test:"In your own accounts, test state, redirect_uri validation, and code leakage via redirect.",burp:"Proxy the full OAuth flow, Repeater callback requests.",example:`https://${I}/oauth/authorize?client_id=<ID>&redirect_uri=https://evil.example  # LAB / own account`,look:"Redirect to attacker domain, missing state, or code in Referer.",impact:"Account takeover via stolen code/token.",falsePos:"Provider validates redirect_uri strictly.",remediation:"Strict redirect_uri, state + PKCE, no tokens in URL.",tools:"Burp Proxy"},{name:"HTTP Host Header Attacks",tag:"host header",what:"Server trusts Host header for URLs, resets, or cache keys.",why:"Password-reset links, cache, or routing built from Host.",where:"Reset, invite, canonical links, cache.",test:"With your own account, send a custom Host and inspect reset emails / cache behavior. Never poison real users.",burp:"Repeater: change Host, add X-Forwarded-Host.",example:`curl -s -H "Host: evil.example" https://${I}/reset -d 'email=test@example.com'  # OWN ACCOUNT ONLY`,look:"Reset link points to evil host, or cache poisoned.",impact:"Password-reset poisoning, cache poisoning.",falsePos:"Server ignores Host, or uses configured base URL.",remediation:"Allow-list Host, use configured base URL, validate forwarded headers.",tools:"Burp, Collaborator"},{name:"Business Logic Vulnerabilities",tag:"business logic",what:"Valid requests abused in ways the app did not intend.",why:"Missing checks on quantity, price, workflow order, or state.",where:"Cart, checkout, coupons, invites, refunds, multi-step flows.",test:"With your own test accounts, try negative qty, replay steps, skip steps, reuse coupons, and race two requests.",burp:"Repeater + Proxy to replay / reorder steps.",example:`curl -s -X POST https://${I}/cart -H "Cookie: <SESSION_COOKIE>" -d 'item=1&qty=-1&price=0'  # OWN TEST ACCOUNT`,look:"Negative total, free item, skipped payment, reused coupon.",impact:"Financial loss, privilege gain, data bypass.",falsePos:"Server recalculates price server-side.",remediation:"Server-side validation on every step, idempotency, audit.",tools:"Burp Repeater"},{name:"SSRF",tag:"ssrf",what:"Server fetches an attacker-chosen URL.",why:"URL input fetched without allow-list / metadata protection.",where:"url=, webhook, image proxy, PDF export, preview.",test:"Authorized only. Use Interactsh / Collaborator for blind detection. For internal targets, ONLY if explicitly authorized — report metadata presence only, never exfiltrate real credentials.",burp:"Repeater with Collaborator URL, watch OOB hits.",example:`curl -s -X POST https://${I}/preview -d '{"url":"https://interactsh.example/abc"}'  # AUTHORIZED ONLY`,look:"OOB hit, internal response, or metadata response.",impact:"Internal access, cloud metadata, port scan via server.",falsePos:"Server fetches but does not return / act on it.",remediation:"Allow-list, block private IPs, no metadata access, timeouts.",tools:"SSRFmap (lab), Interactsh"},{name:"XXE",tag:"xxe xml",what:"XML parser resolves external entities.",why:"DTD / external entities enabled.",where:"XML upload, SOAP, SVG, Office import.",test:"LAB ONLY. Test with file:///etc/passwd style entities only in lab, on your own files.",burp:"Repeater with XML body, watch for file / OOB response.",example:`curl -s -X POST https://${I}/import -H 'Content-Type: application/xml' -d '<!DOCTYPE r [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><r>&xxe;</r>'  # LAB ONLY`,look:"File content or OOB hit.",impact:"File read, SSRF, DoS.",falsePos:"Parser rejects DTD.",remediation:"Disable DTD / external entities, use JSON.",tools:"Burp, XXEinjector (lab)"},{name:"SSTI",tag:"ssti template",what:"User input evaluated as a template expression.",why:"Input passed to template engine without sandbox.",where:"Name, bio, preview, PDF, email templates.",test:"LAB ONLY. Start with {{7*7}} marker, then {{7*'7'}} to detect engine. Never run destructive expressions.",burp:"Repeater with template markers, compare output.",example:`curl -s "https://${I}/preview?name=%7B%7B7*7%7D%7D"  # LAB ONLY`,look:"49 or 7777777 in output.",impact:"RCE via template escape in lab.",falsePos:"App echoes literal {{7*7}}.",remediation:"No user input in templates, sandbox, escape.",tools:"Burp, Tplmap (lab)"},{name:"Insecure Deserialization",tag:"deserialization",what:"Attacker-controlled serialized data executed / abused.",why:"Unsafe pickle / Java / PHP unserialize on user input.",where:"Cookies, tokens, session, import, API objects.",test:"LAB ONLY. Identify serialization format, test tampering in lab. Never send real exploit chains to live targets.",burp:"Decoder + Repeater, check for serialized blobs.",example:`curl -s https://${I}/api/profile -H "Cookie: <SESSION_COOKIE>"  # inspect cookie format`,look:"Serialized object in cookie / body, tampering changes behavior.",impact:"RCE, auth bypass, data tampering.",falsePos:"Signed / encrypted object that rejects tampering.",remediation:"No untrusted deserialization, sign/encrypt, use JSON.",tools:"Burp, ysoserial (lab only)"},{name:"API Vulnerabilities",tag:"api",what:"API flaws: BOLA, mass assignment, excessive data, rate limits, versioning.",why:"APIs expose more fields / versions than the UI.",where:"/api/v1, /api/v2, GraphQL, mobile APIs.",test:"With your own accounts, test object IDs, extra fields (role=admin), version downgrade, and rate limits.",burp:"Proxy API, Repeater mass-assignment, Comparer v1 vs v2.",example:`curl -s -X PATCH https://${I}/api/users/me -H "Cookie: <SESSION_COOKIE>" -d '{"role":"admin"}'  # OWN ACCOUNT, LAB`,look:"Role changed, extra data returned, old version still works.",impact:"Privilege escalation, data exposure.",falsePos:"Server ignores extra fields.",remediation:"Allow-list fields, authz per object, rate limit, deprecate old versions.",tools:"Burp, Postman (authorized)"},{name:"GraphQL Vulnerabilities",tag:"graphql api",what:"GraphQL introspection / batching / deep queries abused.",why:"Introspection on, no depth / cost limits, no authz per field.",where:"/graphql, /api/graphql.",test:"Authorized only. Test introspection, field-level authz, batching, and depth with your own account.",burp:"Repeater GraphQL queries, Intruder for field fuzzing (rate-limited).",example:`curl -s -X POST https://${I}/graphql -H 'Content-Type: application/json' -d '{"query":"{__schema{types{name}}}"}'`,look:"Full schema, sensitive fields, or expensive query succeeds.",impact:"Data exposure, DoS, auth bypass.",falsePos:"Introspection disabled in prod.",remediation:"Disable introspection, depth/cost limits, field authz.",tools:"Burp, GraphQL Voyager (authorized)"},{name:"Race Conditions",tag:"race condition",what:"Concurrent requests bypass a check that works serially.",why:"Check-then-act without atomicity / locking.",where:"Coupons, balance, invites, likes, one-time codes.",test:"With your own test accounts, send parallel requests in Burp / Turbo Intruder in lab. Never race a live payment system without explicit permission.",burp:"Repeater / Turbo Intruder parallel send (lab).",example:`for i in 1 2 3; do curl -s -X POST https://${I}/coupon/use -H "Cookie: <SESSION_COOKIE>" & done; wait  # OWN ACCOUNT, LAB`,look:"Coupon / balance used more times than allowed.",impact:"Double-spend, privilege gain.",falsePos:"Server serializes correctly.",remediation:"Atomic DB ops, locks, idempotency keys.",tools:"Burp Turbo Intruder (lab)"},{name:"WebSockets",tag:"websocket",what:"WebSocket messages lack authz / validation.",why:"Handshake auth not re-checked per message.",where:"Chat, live feed, notifications, trading.",test:"With your own accounts, intercept WS, replay / tamper messages, test cross-user delivery.",burp:"WebSockets history, Repeater for WS.",example:`wscat -c wss://${I}/ws -H "Cookie: <SESSION_COOKIE>"  # AUTHORIZED ONLY`,look:"Messages from other users, or actions without authz.",impact:"Data leak, impersonation, spam.",falsePos:"Server validates every message.",remediation:"Authz per message, validate input, origin check.",tools:"Burp WebSockets"},{name:"Web Cache Poisoning",tag:"cache poisoning",what:"Cache stores a poisoned response served to others.",why:"Unkeyed headers / params reflected into cached page.",where:"Pages with CDN / reverse proxy cache.",test:"With your own account, test unkeyed headers (X-Forwarded-Host) and cache behavior. Never poison real users.",burp:"Repeater with cache-busting, compare cached vs fresh.",example:`curl -s -H "X-Forwarded-Host: evil.example" https://${I}/page?cb=123`,look:"Poisoned content cached for second request.",impact:"XSS / redirect served to victims.",falsePos:"Cache disabled or key includes header.",remediation:"Key on Host, validate unkeyed inputs, no sensitive data in cache.",tools:"Burp, Param Miner (lab)"},{name:"Open Redirect",tag:"open redirect",what:"App redirects to attacker-chosen domain.",why:"redirect / next param not validated.",where:"Login, logout, redirect=, returnUrl.",test:"With your own account, test //evil.example, javascript:, and encoded variants.",burp:"Repeater redirect params, check Location header.",example:`curl -s -i "https://${I}/login?next=https://evil.example"`,look:"Location: evil.example.",impact:"Phishing, OAuth token theft when chained.",falsePos:"Allow-list enforced.",remediation:"Allow-list redirect targets, use relative paths.",tools:"Burp, curl"},{name:"Prototype Pollution",tag:"prototype pollution",what:"Attacker pollutes Object.prototype via JSON merge.",why:"Recursive merge without __proto__ protection.",where:"JSON APIs, client-side merge, query parsing.",test:"LAB ONLY. Test __proto__ / constructor.prototype in lab JSON.",burp:"Repeater JSON body, check for polluted behavior.",example:`curl -s -X POST https://${I}/api/settings -H 'Content-Type: application/json' -d '{"__proto__":{"polluted":"yes"}}'  # LAB ONLY`,look:"Polluted property appears on other objects.",impact:"Auth bypass, DoS, XSS via polluted defaults.",falsePos:"Library blocks __proto__.",remediation:"Use Object.create(null), block __proto__, validate keys.",tools:"Burp, DevTools"},{name:"Subdomain Takeover",tag:"takeover subdomain",what:"Dangling subdomain points to unclaimed cloud / SaaS resource.",why:"DNS CNAME remains after service deleted.",where:"Subdomains with CNAME to GitHub Pages, S3, Heroku, etc.",test:"Passive only at first. Check DNS + provider claim status. Never claim another org's subdomain.",burp:"Not Burp — DNS + Subzy + manual verification.",example:"subzy run --targets subdomains/subdomains.txt",look:"CNAME to unclaimed service + provider says available.",impact:"Content hosting, phishing, cookie / trust abuse.",falsePos:"Service still claimed by owner.",remediation:"Remove dangling DNS, claim / monitor subdomains.",tools:"Subzy, DNSx"}],em=["Program URL read","In-scope domains confirmed","Wildcard understood","Rate limits noted","Testing accounts created","Out-of-scope excluded"],nm=["Burp scope set to target only","Two test accoun
